name: Check

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get -y install \
              cmake \
              g++ \
              git \
              make \
              python3 \
              python3-dev \
              python3-pip
          pip3 install --break-system-packages btest
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - name: Build
        run: |
          ./configure
          (cd build && make -j)
      - name: Run tests
        run: |
          (cd testing && btest -j)
